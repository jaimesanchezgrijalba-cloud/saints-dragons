name: Build Saint's Dragons (Forge)
on:
  push:
    branches:
      - port/1.18.2-forge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saints-dragons-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-forge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORG_GRADLE_JAVA_INSTALLATIONS_FROM_ENV: JAVA_HOME_17_X64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Archive source tree for porting analysis
        run: |
          zip -qr /tmp/saints-dragons-source.zip . \
            -x '.git/*' '*/.git/*' '*/build/*' '*/.gradle/*'
      
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: saints-dragons-source-snapshot
          path: /tmp/saints-dragons-source.zip
          if-no-files-found: error
          retention-days: 7

      - name: Set up Java 21 runtime and Java 17 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Java runtimes
        run: |
          "$JAVA_HOME_21_X64/bin/java" -version
          "$JAVA_HOME_17_X64/bin/java" -version
          JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH" ./gradlew --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Forge project
        run: |
          JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH" \
            ./gradlew :forge:build --no-daemon --stacktrace

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: saints-dragons-forge-build
          path: |
            forge/build/libs/*.jar
            !forge/build/libs/*-dev-shadow.jar
            !forge/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
