name: Build Saint's Dragons (Forge)
on:
  push:
    branches:
      - port/1.18.2-forge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saints-dragons-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-forge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Loom's current dependency graph requires Java 21 to run Gradle.
      # The project itself still targets Java 17 via its Gradle toolchain and --release setting.
      - name: Set up Java 21 runtime and Java 17 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Verify Java runtimes
        run: |
          java -version
          ./gradlew --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Baseline compile first: this checks the untouched 1.20.1 source and CI toolchain.
      - name: Compile Forge project
        run: ./gradlew :forge:build --no-daemon --stacktrace

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: saints-dragons-forge-build
          path: |
            forge/build/libs/*.jar
            !forge/build/libs/*-dev-shadow.jar
            !forge/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
