architectury {
    common rootProject.enabled_platform.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/saintsdragons.accesswidener")
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

dependencies {
    // Mappings
    mappings loom.officialMojangMappings()

    // Fabric Loader is only needed on common compile classpath for @Environment and mixin metadata.
    // Keep it compileOnly so Forge classpaths stay clean at runtime.
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Common source compilation uses the same Forge GeckoLib variant as the platform module.
    modImplementation "software.bernie.geckolib:geckolib-forge-1.18:${rootProject.geckolib_version}"

    // The animation sampler uses GeckoLib's MCLib math types directly.
    // GeckoLib provides MCLib at runtime; expose it explicitly for common compilation.
    compileOnly "com.eliotlash.mclib:mclib:20"

    // Optional JEI integration. The API is available to compile against but is never bundled.
    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"


    // JSR305 for @Nullable/@Nonnull annotations
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.mockito:mockito-core:5.11.0"
}

tasks.named('test') {
    useJUnitPlatform()
    // Loom's development Minecraft classes expose compile-only Fabric interfaces.
    classpath += sourceSets.main.compileClasspath
}

sourceSets {
    main {
        java {
            exclude 'com/leon/saintsdragons/client/compat/emi/**'
        }
    }
}
