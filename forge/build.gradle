plugins {
    id 'com.gradleup.shadow'
}

sourceSets {
    main {
        // This is a Forge-only port: compile the shared source tree directly in the Forge project.
        // This avoids Architectury's cross-platform common remapping and keeps Forge dependencies
        // (including GeckoLib 3) on the actual javac compile classpath.
        java {
            srcDir '../common/src/main/java'
            // EMI is not part of the Forge 1.18.2 target.
            exclude 'com/leon/saintsdragons/client/compat/emi/**'
            // Jade is an optional UI integration and is not required for the mod's core gameplay.
            exclude 'com/leon/saintsdragons/forge/integration/jade/**'
            // This worldgen mixin targets a post-1.18.2 structure-state implementation.
            exclude 'com/leon/saintsdragons/forge/mixin/ChunkGeneratorStructureStateMixin.java'
            exclude 'com/leon/saintsdragons/forge/world/AddConditionalFeaturesBiomeModifier.java'
            exclude 'com/leon/saintsdragons/forge/world/AddDragonsBiomeModifier.java'
            exclude 'com/leon/saintsdragons/common/world/ConfiguredStructureSets.java'
        }
    }

    dataGenerator {
        java.srcDir 'src/datagen/java'
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

loom {
    forge {
        mixinConfig "saintsdragons.mixins.json"
    }

    runs {
        client {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            client()
            setConfigName("Forge Client")
            ideConfigGenerated(true)
            runDir("../run")
            programArgs("--username", "DevPlayer")
        }
        server {
            server()
            setConfigName("Forge Server")
            ideConfigGenerated(true)
            runDir("../run")
            programArgs("--nogui")
        }
        data {
            data()
            source sourceSets.dataGenerator
            mainClass.set("com.leon.saintsdragons.forge.datagen.ForgeDataGenBootstrap")
            setConfigName("Forge Data")
            ideConfigGenerated(true)
            runDir("../run-data")
            programArgs(
                    "--mod", project.rootProject.mod_id.toString(),
                    "--all",
                    "--output", file("../common/src/generated/resources").absolutePath,
                    "--existing", file("../common/src/main/resources").absolutePath
            )
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven { url = "https://cursemaven.com" }
}

dependencies {
    mappings loom.officialMojangMappings()

    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    compileOnly "com.eliotlash.mclib:mclib:20"
    // Standalone math types used by legacy shared rendering/collision helpers.
    compileOnly "org.joml:joml:1.10.2"
    forgeRuntimeLibrary("org.joml:joml:1.10.2")
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    // Compile-only bridge for Fabric @Environment metadata that can appear on shared/common deps.
    // This avoids javac "unknown enum constant EnvType.CLIENT" warnings in Forge builds.
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // GeckoLib Forge
    modImplementation "software.bernie.geckolib:geckolib-forge-1.18:${rootProject.geckolib_version}"
    forgeRuntimeLibrary("com.eliotlash.mclib:mclib:20")

    // Optional JEI integration: API-only for production, full mod in local development.
    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
    
    modLocalRuntime "mezz.jei:jei-${rootProject.minecraft_version}-forge:${rootProject.jei_version}"

}

processResources {
    inputs.properties(
            version: project.version,
            minecraft_version_range: rootProject.minecraft_version_range,
            forge_version_range: rootProject.forge_version_range,
            loader_version_range: rootProject.loader_version_range
    )
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    filesMatching('META-INF/mods.toml') {
        expand(
                version: project.version,
                minecraft_version_range: rootProject.minecraft_version_range,
                forge_version_range: rootProject.forge_version_range,
                loader_version_range: rootProject.loader_version_range
        )
    }

    // Ensure the mod logo is included for Forge (dev and built jars)
    from("$rootDir/common/src/main/resources/assets/saintsdragons/saintsdragons.png") {
        into "assets/saintsdragons"
    }
}

sourceSets {
    main {
        resources.srcDirs = [
                'src/main/resources',
                '../common/src/main/resources',
                '../common/src/generated/resources'
        ]
    }
}

remapJar {
    archiveFileName.set("saintsdragons-${project.version}+forge-${rootProject.minecraft_version}.jar")
}

// The shared Java sources are part of this Forge source set, so the regular sourcesJar includes them.
